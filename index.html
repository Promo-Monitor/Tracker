<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promo Tracker – cataloage retail</title>
<style>
:root{--ink:#1b1f24;--muted:#5d6672;--line:#e3e6ea;--bg:#f5f6f8;--card:#fff;--tccc:#d1121f;--pep:#1f4ea8;--comp:#5d6672;--chip:#eef0f3}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 14px 10px}
h1{font-size:18px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
select,input[type=search]{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:0}
input[type=search]{flex:1 1 140px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:6px;padding:10px 14px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{font-size:13px}.stat .bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:6px 0 4px;background:var(--chip)}
.stat .bar i{display:block}.stat small{color:var(--muted);font-size:11px}
.tools{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 0;color:var(--muted);font-size:12px;gap:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.btn:disabled{opacity:.6}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer;color:var(--ink)}
main{padding:10px 14px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
@media(min-width:700px){main{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;background:#fafafa;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain}
.badge{position:absolute;top:6px;left:6px;background:var(--ink);color:#fff;font-weight:700;font-size:12px;padding:2px 7px;border-radius:999px}
.cat{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.92);border:1px solid var(--line);font-size:10px;padding:1px 6px;border-radius:999px;color:var(--muted)}
.bd{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.meta{color:var(--muted);font-size:11px}
.brand{font-weight:700;font-size:14px}
.brand.TCCC{color:var(--tccc)}.brand.PepsiCo{color:var(--pep)}.brand.Competitor{color:var(--comp)}
.prod{font-size:12px;color:#333;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pack{font-size:11px;color:var(--muted)}
.price{margin-top:4px}.now{font-size:17px;font-weight:700}.old{color:var(--muted);text-decoration:line-through;font-size:12px;margin-left:4px}
.mech{font-size:11px;color:var(--muted)}
.lnk{margin-top:auto;padding-top:6px;font-size:12px}
.lnk a{color:#1d4ed8;text-decoration:none}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;display:none}
footer{color:var(--muted);font-size:11px;padding:0 14px 30px}
</style>
</head>
<body>
<header>
  <h1>Promo Tracker – cataloage retail</h1>
  <div class="sub" id="sub">Se încarcă…</div>
  <div class="chips" id="cats"></div>
  <div class="row">
    <select id="co"><option value="">Toate companiile</option><option value="TCCC">TCCC</option><option value="COMP">Concurență</option></select>
    <select id="re"><option value="">Toți retailerii</option></select>
    <select id="pe"><option value="active">Active azi + viitoare</option><option value="now">Active azi</option><option value="future">Viitoare</option><option value="">Toate (istoric)</option></select>
    <input type="search" id="q" placeholder="Caută brand, produs…">
  </div>
</header>
<section class="summary" id="sum"></section>
<div class="tools"><span id="cnt"></span><span class="acts"><button class="btn" id="xl" title="Toate aparițiile, cu filtre pe fiecare coloană">⬇ Excel</button><button class="btn" id="pdf" title="Aparițiile afișate acum, cu poze">⬇ PDF</button><button class="btn" id="copy">Copiază</button></span></div>
<main id="grid"></main>
<footer id="foot"></footer>
<div class="toast" id="toast"></div>
<script src="export.js"></script>
<script>
const CATS=["SSD","Water","Energy","RTD Tea","Juice"];
const CATRO={"SSD":"SSD","Water":"Apă","Energy":"Energy","RTD Tea":"RTD Tea","Juice":"Suc"};
let D={promos:[],catalogs:[]}, cat="";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>v==null?"":v.toFixed(2).replace(".",",");
const dm=s=>s?s.slice(8,10)+"."+s.slice(5,7):"";
const today=new Date(Date.now()+2*3600e3).toISOString().slice(0,10);
const isComp=p=>p.company!=="TCCC";
function pack(p){const a=[];if(p.pack_type)a.push(p.pack_type);if(p.pack_size_l)a.push(String(p.pack_size_l).replace(".",",")+" L");if(p.pieces&&p.pieces>1)a.push(p.pieces+" buc.");return a.join(" · ")}
function filtered(){
  const co=$("co").value,re=$("re").value,pe=$("pe").value,q=$("q").value.trim().toLowerCase();
  return D.promos.filter(p=>{
    if(cat&&p.category!==cat)return false;
    if(co==="TCCC"&&p.company!=="TCCC")return false;
    if(co==="COMP"&&!isComp(p))return false;
    if(re&&p.retailer!==re)return false;
    if(pe==="active"&&p.valid_to<today)return false;
    if(pe==="now"&&(p.valid_from>today||p.valid_to<today))return false;
    if(pe==="future"&&p.valid_from<=today)return false;
    if(q&&!(p.brand+" "+p.product+" "+p.retailer).toLowerCase().includes(q))return false;
    return true}).sort((a,b)=>(b.valid_from>a.valid_from)-(b.valid_from<a.valid_from)||a.retailer.localeCompare(b.retailer)||a.page-b.page)}
function render(){
  const L=filtered();
  $("cnt").textContent=L.length+" apariții afișate";
  $("grid").innerHTML=L.length?L.map(p=>`<article class="card">
    <div class="ph"><img loading="lazy" src="${esc(p.img)}" alt="${esc(p.brand)}">${p.discount_pct!=null?`<span class="badge">-${p.discount_pct}%</span>`:""}<span class="cat">${esc(CATRO[p.category]||p.category)}</span></div>
    <div class="bd"><div class="meta"><b>${esc(p.retailer)}</b> · ${dm(p.valid_from)}–${dm(p.valid_to)} · p.${esc(p.page)}</div>
    <div class="brand ${esc(p.company)}">${esc(p.brand)}</div>
    <div class="prod">${esc(p.product)}</div><div class="pack">${esc(pack(p))}${p.price_per_l?` · ${num(p.price_per_l)} lei/L`:""}</div>
    <div class="price"><span class="now">${p.promo_price!=null?num(p.promo_price)+" lei":"—"}</span>${p.regular_price!=null?`<span class="old">${num(p.regular_price)}</span>`:""}</div>
    <div class="mech">${esc(p.mechanic)}${p.condition?" · "+esc(p.condition):""}</div>
    <div class="lnk"><a href="${esc(p.viewer_url)}" target="_blank" rel="noopener">Vezi în catalog ↗</a></div></div></article>`).join(""):`<div class="empty">Nicio apariție pentru filtrele alese.</div>`;
  const S=D.promos.filter(p=>($("pe").value===""||p.valid_to>=today));
  $("sum").innerHTML=CATS.map(c=>{const a=S.filter(p=>p.category===c),t=a.filter(p=>p.company==="TCCC").length,o=a.length-t,w=a.length?Math.round(t/a.length*100):0;
    return `<div class="stat"><b>${CATRO[c]}</b><div class="bar"><i style="width:${w}%;background:var(--tccc)"></i><i style="width:${100-w}%;background:#9aa3ad"></i></div><small>TCCC ${t} · Concurență ${o}</small></div>`}).join("");
}
function init(){
  $("cats").innerHTML=[["","Toate"],...CATS.map(c=>[c,CATRO[c]])].map(([v,l])=>`<button class="chip${v===cat?" on":""}" data-v="${v}">${l}</button>`).join("");
  $("cats").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.dataset.v;[...$("cats").children].forEach(x=>x.classList.toggle("on",x===b));render()};
  const rs=[...new Set(D.promos.map(p=>p.retailer))].sort();
  $("re").innerHTML='<option value="">Toți retailerii</option>'+rs.map(r=>`<option>${esc(r)}</option>`).join("");
  ["co","re","pe","q"].forEach(id=>$(id).addEventListener("input",render));
  const up=D.updated?D.updated.slice(8,10)+"."+D.updated.slice(5,7)+" "+D.updated.slice(11,16):"";
  $("sub").textContent=`Actualizat ${up} · ${D.promos.length} apariții · ${D.catalogs.length} cataloage · se actualizează zilnic la 07:00`;
  $("foot").innerHTML=`Surse: cataloagele online Lidl, Kaufland, Carrefour, Mega Image, Penny; Profi prin Kaufino.com (site-ul Profi blochează accesul automat). ${D.retailers_blocked&&D.retailers_blocked.length?"În așteptare: "+esc(D.retailers_blocked.join(", "))+" (site protejat anti-bot).":""} Prețurile promo „al 2-lea la -X%” sunt per bucată, în combinație.`;
  render();
}
$("copy").onclick=async()=>{
  const H=["Retailer","Catalog","Valabil de la","Valabil până la","Pagina","Categorie","Companie","Brand","Produs","Ambalaj","Pack size (L)","Buc.","Preț promo","Preț vechi","Discount %","Preț/L","Mecanică","Condiție","Link"];
  const R=filtered().map(p=>[p.retailer,p.catalog_title,p.valid_from,p.valid_to,p.page,p.category,p.company,p.brand,p.product,p.pack_type,p.pack_size_l??"",p.pieces??"",p.promo_price??"",p.regular_price??"",p.discount_pct??"",p.price_per_l??"",p.mechanic,p.condition,p.viewer_url].map(v=>String(v??"").replace(/[\t\n]/g," ").replace(/^(\d+)\.(\d+)$/,"$1,$2")));
  const tsv=[H,...R].map(r=>r.join("\t")).join("\n");
  try{await navigator.clipboard.writeText(tsv);toast("Copiat "+R.length+" rânduri – lipește în Excel")}catch(e){toast("Copierea nu e permisă aici")}
};
$("xl").onclick=async()=>{try{const n=await exportXLSX(D,today);if(n>=0)toast("Excel salvat – "+n+" rânduri, cu filtre")}catch(e){toast("Exportul Excel a eșuat: "+(e.message||e))}};
$("pdf").onclick=async()=>{const b=$("pdf");b.disabled=true;b.textContent="Se generează…";
  try{const L=filtered(),q=$("q").value.trim();
    const f=[cat?CATRO[cat]:"Toate categoriile",$("co").selectedOptions[0].text,$("re").selectedOptions[0].text,$("pe").selectedOptions[0].text,q?"„"+q+"”":""].filter(Boolean).join(" · ");
    const n=await exportPDF(L,f+" · "+L.length+" apariții · generat "+today.split("-").reverse().join("."),CATRO);if(n>=0)toast("PDF salvat – "+L.length+" apariții")}
  catch(e){toast("Exportul PDF a eșuat: "+(e.message||e))}
  b.disabled=false;b.textContent="⬇ PDF"};
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2500)}
fetch("data.json",{cache:"no-store"}).then(r=>r.json()).then(j=>{D=j;init()}).catch(()=>{$("sub").textContent="Nu am putut încărca datele."});
</script>
</body>
</html>
